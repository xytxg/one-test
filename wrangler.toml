name = "surge-config-merge"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = true

[[durable_objects.bindings]]
name = "APP_STATE"
class_name = "AppState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppState"]

[triggers]
crons = ["*/30 * * * *"]

[vars]
APP_NAME = "Surge Config Merge"
SESSION_TTL_SECONDS = "604800"
MAX_PROFILE_BYTES = "2097152"
UPSTREAM_TIMEOUT_MS = "15000"
PBKDF2_ITERATIONS = "210000"
